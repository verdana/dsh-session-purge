name: checks
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Platform parity. The Windows/POSIX path work is deliberately retested on
  # every OS: the pure helpers take an injectable path flavor, and the
  # filesystem test additionally exercises the host's real separators, temp
  # directory and recursive removal.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check lib/index.js
          node --check client/client.js
      - name: Manifest check
        run: |
          node -e "
            const p = require('./package.json');
            if (!p.dsh || !p.dsh.bundle || !p.dsh.bundle.patch) {
              throw new Error('package.json must declare dsh.bundle.patch');
            }
            const fs = require('fs');
            const patch = fs.readFileSync(p.dsh.bundle.patch, 'utf8');
            if (!/-\s*insert:/.test(patch) || !/id:\s*session-purge/.test(patch)) {
              throw new Error('cordis.patch.yml must insert the session-purge entry');
            }
            if (!/name:\s*'?dsh-session-purge'?/.test(patch)) {
              throw new Error('cordis.patch.yml must name the dsh-session-purge package');
            }
            console.log('manifest ok');
          "
      - name: Regression tests
        run: node --test tools/helpers.test.mjs

  # Same suite on the oldest and newest supported Node lines, so a stdlib
  # behaviour change (fs.rm, path, homedir, test runner) cannot slip through.
  node-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Regression tests
        run: node --test tools/helpers.test.mjs
