name: checks
on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check lib/index.js
          node --check client/client.js
      - name: Manifest check
        run: |
          node -e "
            const p = require('./package.json');
            if (!p.dsh || !p.dsh.bundle || !p.dsh.bundle.patch) {
              throw new Error('package.json must declare dsh.bundle.patch');
            }
            const fs = require('fs');
            const patch = fs.readFileSync(p.dsh.bundle.patch, 'utf8');
            if (!/-\s*insert:/.test(patch) || !/id:\s*session-delete/.test(patch)) {
              throw new Error('cordis.patch.yml must insert the session-delete entry');
            }
            console.log('manifest ok');
          "
